name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  frontend:
    name: Frontend typecheck · lint · build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: opendmo/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: opendmo/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-out, path: opendmo/frontend/out, retention-days: 7 }

  backend:
    name: Backend tests + boot smoke (${{ matrix.os }}, py${{ matrix.python }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - uses: actions/download-artifact@v4
        with: { name: frontend-out, path: opendmo/backend/app/static }
      - name: Install test dependencies
        run: python -m pip install -r opendmo/backend/requirements-dev.txt
      - name: pytest
        working-directory: opendmo/backend
        run: python -m pytest
      - name: Boot smoke test via run.py (creates .venv, installs pinned deps, serves UI + API)
        working-directory: opendmo
        run: python scripts/smoke_test.py
      - name: Native launcher smoke (start-linux.sh)
        if: runner.os == 'Linux'
        working-directory: opendmo
        run: ./start-linux.sh --smoke --port 8899 --no-browser 2>&1 | tee launcher.log && grep -q "smoke test passed" launcher.log
      - name: Native launcher smoke (start-mac.command)
        if: runner.os == 'macOS'
        working-directory: opendmo
        run: ./start-mac.command --smoke --port 8899 --no-browser < /dev/null 2>&1 | tee launcher.log && grep -q "smoke test passed" launcher.log
      - name: Native launcher smoke (start-windows.bat)
        if: runner.os == 'Windows'
        working-directory: opendmo
        shell: pwsh
        run: |
          cmd /c "start-windows.bat --smoke --port 8899 --no-browser < NUL" 2>&1 | Tee-Object -FilePath launcher.log
          if (-not (Select-String -Path launcher.log -Pattern "smoke test passed" -Quiet)) { exit 1 }

  postgres:
    name: Backend tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: opendmo, POSTGRES_USER: opendmo, POSTGRES_DB: opendmo_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opendmo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r opendmo/backend/requirements-dev.txt -r opendmo/backend/requirements-postgres.txt
      - working-directory: opendmo/backend
        env: { OPENDMO_TEST_DATABASE_URL: 'postgresql+psycopg://opendmo:opendmo@localhost:5432/opendmo_test' }
        run: python -m pytest

  ui:
    name: Browser gate (all views, no console errors, no remote requests)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: frontend-out, path: opendmo/backend/app/static }
      - run: python -m pip install -r opendmo/backend/requirements.txt
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.56.1
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Start server and run browser checks
        working-directory: opendmo
        run: |
          python run.py --no-venv --no-browser --port 8000 --data-dir /tmp/opendmo-ui &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/api/system/demo/load-all > /dev/null
          NODE_PATH=/tmp/pw/node_modules node scripts/ui_check.mjs http://127.0.0.1:8000

  release:
    name: Build release ZIP
    needs: [backend, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: opendmo/frontend/package-lock.json }
      - run: python -m pip install -r opendmo/backend/requirements.txt
      - run: python opendmo/scripts/build_release.py --out /tmp/release/opendmo-v2.0.zip
      - uses: actions/upload-artifact@v4
        with: { name: opendmo-v2.0, path: /tmp/release/, retention-days: 30 }
